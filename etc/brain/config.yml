# 2dph typed configuration (internal/config).
#
# Load stack, deep-merged lowest→highest priority:
#   etc/brain/config.yml → etc/brain/config.local.yml (gitignored) → .env → process env
# Maps recurse; scalar leaves are last-write-wins; keys are lower+alnum.
# Transitional legacy env names (KB_*, BRAIN_SEARCH_*) override these for now.
#
# Copy this file to etc/brain/config.local.yml and edit it for machine-local
# overrides — do not commit secrets or absolute host paths here.

# Repo root (corpus/db location). Legacy: KB_ROOT. Empty = auto-discover.
root: ""

# HTTP API server (pkg/httpapi / bin/brain/serve.go).
host: "127.0.0.1"      # Legacy: KB_HOST. Use 0.0.0.0 when container-published.
port: 8630             # Legacy: KB_PORT.
workers: 4             # Legacy: KB_WORKERS. Parallel search backends.
pprof: ""              # Legacy: KB_PPROF. e.g. "6060" to expose /debug/pprof.

# Search backend / embedding daemon (internal/brain).
search_cmd: ""                  # Legacy: KB_SEARCH_CMD. Empty = <root>/var/bin/brain-search.
search_daemon_port: 17830       # Legacy: KBSEARCH_PORT.
search_no_daemon: false         # Legacy: KBSEARCH_NO_DAEMON=1 disables the embed daemon.
model: ""                       # Legacy: KBSEARCH_MODEL. Explicit potion model dir.
hf_home: ""                     # Legacy: HF_HOME. HuggingFace cache root.

# Ladybug buffer pool (bytes). Legacy: KB_BUFFER_POOL.
buffer_pool: 1073741824

# Indexer (bin/brain/index.go).
index_allow_live: false         # Legacy: KB_INDEX_ALLOW_LIVE=1 skips the live-db guard.

# Watch (bin/brain/watch.go). Legacy: KB_WATCH_INTERVAL / KB_WATCH_DIRS.
watch_interval: 30              # seconds
watch_dirs: []                  # e.g. ["/corpus"]

# OnlyOffice CLI path override (internal/mailsync). Legacy: OO_CLI.
oocli: ""

# SearXNG web search (internal/websearch). Legacy: BRAIN_SEARCH_*.
search:
  url: ""    # BRAIN_SEARCH_URL
  user: ""   # BRAIN_SEARCH_USER
  pass: ""   # BRAIN_SEARCH_PASS
  cache: ""  # BRAIN_SEARCH_CACHE
  env: ""    # BRAIN_SEARCH_ENV

# Reasoner (internal/reasoner client, bin/reasoner/bench.go). Legacy: REASONER_*.
reasoner:
  baseurl: "http://127.0.0.1:11435/v1"   # REASONER_BASE_URL
  model: "qwen3.5:9b"                    # REASONER_MODEL
  device: "cpu"                          # REASONER_DEVICE

# Synapse Matrix service (bin/brain/synapse-matrix.go, issue #82): expose brain
# leafs+edges for pc-agent. Legacy: KB_SYNAPSE_*.
synapse:
  host: "127.0.0.1"      # KB_SYNAPSE_HOST. 0.0.0.0 requires a token.
  port: 8632             # KB_SYNAPSE_PORT.
  token: ""              # KB_SYNAPSE_TOKEN. Empty = loopback bind only.

# Outlook PST import (bin/mail/import-pst.go, issue #185): readpst -e → .eml →
# the mailconv pipeline. The .pst file inventory is machine-local (source map
# #79); put the real paths in config.local.yml, never in code. Missing
# pst.sources = explicit error from the tool pointing at this file.
pst:
  sources: []            # e.g. [{label: pst-andriy, path: "<abs path, see #79>"}]
  readpst: ""            # readpst binary override; empty = PATH, then var/dist/readpst
  out: ""                # corpus root; empty = <root>/var/corpus/mail/pst
  state: ""              # checkpoint; empty = <root>/var/state/pst.json

# Mail incubator ETL (bin/mail/incubator.go, issue #252 / epic #250): legacy
# .eml corpora → doveadm save into docker-mailserver incubator owner mailboxes.
# Model (decision 2026-09-02): the incubator mailbox IS the owner's historical
# address per period (гдеgroup → andriy.oblivantsev@wheregroup.com) and
# messages are routed by recipient — owner in From → Sent, owner in
# To/CC/Delivered-To → INBOX, owner nowhere → INBOX/Unmatched. Corpus roots are
# machine-local inventory — put the real paths in config.local.yml, never in
# code. Missing incubator.imports = explicit error from the tool pointing at
# this file.
incubator:
  docker: ""             # docker binary override; empty = PATH lookup
  container: "mailserver" # docker-mailserver container name
  imports: []            # e.g. [{label: wheregroup, source: "<profile root, see #79>", user: "andriy.oblivantsev@wheregroup.com", owner: "andriy.oblivantsev@wheregroup.com", state: ""}]
                         # multi-owner/marketing knobs (defacto, gator #101): owner_strict: true (foreign mail skipped to the sibling owner's pass),
                         # skip_state: ["<absolute>/incubator-gmail.json", ...] (global dedup vs already-imported sources),
                         # skip_from: ["gewinnspiel@loewe.de"] (sender filter, never imported/manifested).

# Vector ANN index (issues #204/#206): IVF (k-means + exact cosine over the
# probed cells) outside liblbug (whose own HNSW crashes on grown graphs,
# #192). Maintained by the wave's ann-build step (bin/brain/ann.go ensure:
# full build when the index is missing/stale, incremental WAL-upsert
# otherwise); serve/CLI search read it at startup (warm start) and fall back
# to the linear scan when it is missing or corrupt. Params map to
# internal/brain/ann.Defaults() when zero.
vector:
  ann:
    enabled: true           # serve/CLI search via ANN (default, #206); disabled = linear scan
    index: ""               # default <root>/var/state/vector.ann (+ .wal)
    dim: 256                # embedding dimension (model2vec/potion-multilingual-128M)
    nlist: 2000             # IVF k-means cells (~150 vectors per cell at 313k)
    nprobe: 2000            # cells probed per search. Decision #206: 2000 = full probe, recall@5=1.0,
                            # p50 ~0.4s; 256 = p50 ~0.28s but recall@5 ~0.9 — correctness first, tune later.

# Gator mail canon importer (bin/mail/graph.go, D-1.3 #260): read-only hive
# root of parquet/mail (source=mail/channel=*/dt=*/ on the shared gator var).
# Machine-local path — put the real value in config.local.yml, never in code.
# Empty = pass --hive or set GATOR_MAIL_HIVE.
gator:
  mailhive: ""             # e.g. <gator var>/parquet/mail (machine-local, см. #79 inventory)
  documentshive: ""         # e.g. <gator var>/parquet/documents (kind=document C1 #117); empty/absent = skip

# Mail canon for the periodic index cycle (T10-A). Decision: the local 2dph
# M365 corpus is the info-corpus mail canon; gator stays documents-only (its
# mail client is plain IMAP, the Edelweiss boxes are M365/OAuth synced by 2dph).
#   corpus (default) — brain-index --with-mail indexes var/corpus/mail/m365
#                      (content-address external_id); gator parquet/mail
#                      leaf+graph is NOT used (single canon, no duplicate Leafs).
#   gator            — legacy gator parquet/mail → mail-leaf + mail-graph.
# Env MAIL_SOURCE (read by bin/stack/index-loop.go) overrides this. The
# document tree (gator parquet/documents → doc-leaf) is imported in both modes.
mail_source: "corpus"
