name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Создать релиз: тег + версионный образ"
        type: boolean
        default: false
      line:
        description: "Release line, e.g. 0.24"
        type: string
        default: "0.24"
      backfill_version:
        description: "Backfill: версия для перетегирования, e.g. v0.24.13"
        type: string
        default: ""
      backfill_source:
        description: "Backfill: существующий тег-источник"
        type: string
        default: "api"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Guard (paths, pycache)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No hardcoded user/mount paths in tracked non-md files
        run: |
          # split literals so this line cannot match its own pattern
          re="/m""nt/|/h""ome/[a-z]+/|/U""sers/"
          if git grep -nE "$re" -- ':!*.md'; then
            echo "::error::hardcoded absolute path(s) above; use env vars (\$HOME, \$PROJECTS_ROOT)" >&2
            exit 1
          fi

      - name: No __pycache__ under bin/
        run: |
          if find bin -type d -name __pycache__ | grep -q .; then
            echo "::error::__pycache__ directories found under bin/:" >&2
            find bin -type d -name __pycache__
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Shell syntax check
        run: |
          bash -n scripts/db/psql-yq
          bash -n scripts/db/ssh-tunnel
          bash -n scripts/docker-entrypoint
          bash -n bin/cgo/zig
          sh -n bin/cgo/zcc
          sh -n bin/cgo/zc++

      - name: Go tests (root module; duckdb-go CGO via gcc, no ladybug)
        if: github.server_url == 'https://github.com'
        run: |
          CC=gcc CXX=g++ CGO_CFLAGS= CGO_LDFLAGS= go vet ./...
          CC=gcc CXX=g++ CGO_CFLAGS= CGO_LDFLAGS= go test ./... -count=1

      - name: Go tests (root module, no duckdb CGO; Gitea runner libstdc++ is too old for duckdb static lib)
        if: github.server_url != 'https://github.com'
        run: |
          PKGS="$(go list ./... | grep -v /pkg/duckdb)"
          go vet $PKGS
          go test $PKGS -count=1

      - name: brain ranking tests (no cgo / no ladybug)
        run: go test ./internal/brain/rank -count=1

      - name: brain client (P-9.5, cgo-free SDK + CLI compile)
        run: |
          go test ./pkg/brainclient/... -count=1
          go run -tags=brain_client ./bin/brain/client.go help >/dev/null

      - name: facts/audit self (lexicon consistency, no network)
        run: ./bin/facts/audit.go self

      - name: CGO via Zig (compile brain/search + index + add + eval + bench + ann)
        run: |
          chmod +x bin/cgo/zig bin/cgo/zcc bin/cgo/zc++
          bin/cgo/zig go build -tags system_ladybug -o /tmp/brain-search ./bin/brain/search.go
          bin/cgo/zig go build -tags 'system_ladybug,brain_index' -o /tmp/brain-index ./bin/brain/index.go
          bin/cgo/zig go build -tags 'system_ladybug,brain_add' -o /tmp/brain-add ./bin/brain/add.go
          bin/cgo/zig go build -tags 'system_ladybug,brain_eval' -o /tmp/brain-eval ./bin/brain/eval.go
          bin/cgo/zig go build -tags 'system_ladybug,brain_bench' -o /tmp/brain-bench ./bin/brain/bench.go
          bin/cgo/zig go build -tags 'system_ladybug,brain_ann' -o /tmp/brain-ann ./bin/brain/ann.go

      - name: Go write-path tests (Zig CGO ladybug, in-process)
        if: github.server_url == 'https://github.com'
        run: bin/cgo/zig go test -tags system_ladybug ./internal/brain/... -count=1

      - name: mailgraph import cycle (gcc CGO ladybug + duckdb, D-1.3)
        if: github.server_url == 'https://github.com'
        run: |
          # zig-линковка duckdb static lib не встаёт (libstdc++ ABI), поэтому
          # полный цикл parquet → Ladybug гоняется gcc: bin/cgo/zig env ниже
          # только скачивает liblbug в lib-ladybug.
          ./bin/cgo/zig env >/dev/null
          CC=gcc CXX=g++ \
            CGO_CFLAGS="-I$PWD/lib-ladybug" \
            CGO_LDFLAGS="-L$PWD/lib-ladybug -Wl,-rpath,$PWD/lib-ladybug -llbug" \
            LD_LIBRARY_PATH="$PWD/lib-ladybug${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            go test -tags system_ladybug ./internal/mailgraph/ -run TestImportCycle -count=1

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-potion-multilingual-128M

      - name: recall@5 SoT (Go index + Zig bin/brain/eval.go)
        if: github.server_url == 'https://github.com'
        run: |
          # Go downloader fetches potion weights into the HF cache (skips if cached)
          go run ./bin/brain/model.go
          /tmp/brain-index --rebuild --json
          KB_ROOT="$PWD" /tmp/brain-eval --json

      - name: search bench gate (golden-set recall@5 >= 0.95, offline)
        if: github.server_url == 'https://github.com'
        run: |
          # Same schema as eval.go: corpus rebuilt above, DB quiescent →
          # --inproc opens it read-only; the /embed daemon spawns from the
          # bench binary itself. Exits 2 when the recall gate fails.
          KB_ROOT="$PWD" /tmp/brain-bench --inproc --json

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute scan range (diff of new commits only)
        id: range
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="$(git rev-list --max-parents=0 HEAD | tail -1)..$GITHUB_SHA"
            else
              RANGE="$BEFORE..$GITHUB_SHA"
            fi
          fi
          echo "RANGE=$RANGE" >> "$GITHUB_ENV"
          echo "Scanning range: $RANGE"

      - name: Gitleaks (diff-only, fail on leak)
        env:
          GITLEAKS_RANGE: ${{ env.RANGE }}
        run: |
          set -euo pipefail
          # install the gitleaks binary (linux-amd64) instead of a docker action:
          # the docker://zricethezav/gitleaks action hardcodes /github/workspace,
          # which does not exist on the Gitea (act) runner. $GITHUB_WORKSPACE is the
          # checkout dir on BOTH runners (GitHub and Gitea act).
          curl -fsSLo /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks detect \
            --source "$GITHUB_WORKSPACE" \
            --log-opts="$GITLEAKS_RANGE" \
            --redact \
            --verbose

  ocr:
    name: OCR (tesseract fixture)
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      - name: OCR tests (tesseract in docker, no apt)
        run: |
          go test -c -o /tmp/ocr.test ./internal/ocr
          docker run --rm --user root --entrypoint bash \
            -e OCR_LANG=eng \
            -v /tmp/ocr.test:/ocr.test \
            -v "$PWD":/work:ro -w /work/internal/ocr \
            jitesoft/tesseract-ocr:latest -c '/ocr.test -test.v'

  # Release: tag + GitHub Release, on demand only.
  #
  # No `push: tags` trigger: `gh release create` runs with GITHUB_TOKEN, and
  # GitHub never starts new workflow runs for events caused by GITHUB_TOKEN.
  # That is why the old tag-triggered docker job never ran (#9) and
  # `latest` / `v*` were never published. The versioned image is now built in
  # this very run by the docker job, using this job's `tag` output.
  release:
    name: Release (semver)
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.release == true
      && inputs.backfill_version == '' && github.server_url == 'https://github.com'
    needs: [test, ocr]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    outputs:
      tag: ${{ steps.semver.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compute next semver for the release line
        id: semver
        env:
          LINE: ${{ inputs.line }}
        run: |
          set -euo pipefail
          chmod +x bin/semver/next.go
          TAG="$(./bin/semver/next.go --line "$LINE")"
          echo "next tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag + GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semver.outputs.tag }}
        run: |
          set -euo pipefail
          PREV=$(git tag --sort=-v:refname | grep -v "^$TAG$" | head -1 || true)
          RANGE=""
          [ -n "$PREV" ] && RANGE="$PREV..HEAD"
          # git log limited with -n (not piped to head) to avoid SIGPIPE under pipefail
          { echo "2dph $TAG — changes from conventional commits";
            git log --format='- %s' -n 40 $RANGE; } > /tmp/notes
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file /tmp/notes

  docker:
    name: Docker (api image)
    # always(): the release job is skipped on push/workflow_dispatch without
    # `release: true`, and :api + :sha-* must still be published. Versioned
    # tags are added from needs.release.outputs.tag when a release was made.
    # An on-demand backfill run retags an existing image instead (backfill job).
    if: >-
      always() && github.server_url == 'https://github.com'
      && needs.test.result == 'success'
      && (needs.ocr.result == 'success' || needs.ocr.result == 'skipped')
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && inputs.backfill_version == ''
    needs: [test, ocr, release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="$REPO:api,$REPO:sha-${GITHUB_SHA::12}"
          VERSION="edge"
          # A release run also publishes the versioned tag and moves `latest`.
          if [ -n "${RELEASE_TAG:-}" ]; then
            TAGS="$TAGS,$REPO:$RELEASE_TAG,$REPO:latest"
            VERSION="$RELEASE_TAG"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: api
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=2dph
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke (api image)
    needs: [docker]
    if: >-
      always() && needs.docker.result == 'success'
      && github.server_url == 'https://github.com'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && inputs.backfill_version == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No DB fixture: /health, /openapi.json and MCP tools/list are served
      # without touching kb.lbug. Two container details are load-bearing:
      #   * --tmpfs /data/var — the image runs as uid 1001 and /data is
      #     root-owned, but brain-serve opens $KB_ROOT/var/kb.lbug at startup
      #     and the parent dir must exist and be writable;
      #   * KB_HOST=0.0.0.0 — the default bind is 127.0.0.1, which is not
      #     reachable through the published port.
      - name: Run api image and probe endpoints
        env:
          CONTAINER: 2dph-smoke
          PORT: 18630
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::12}"
          cleanup() { docker rm -f "$CONTAINER" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --rm --name "$CONTAINER" \
            --tmpfs /data/var:uid=1001,gid=1001 \
            -p "${PORT}:8630" \
            -e KB_HOST=0.0.0.0 \
            -e KBSEARCH_NO_DAEMON=1 \
            "$IMAGE"

          ok=""
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null 2>&1; then
              ok=1
              echo "/health ready after ${i}s"
              break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::/health not ready after 30s"
            docker logs "$CONTAINER" || true
            exit 1
          fi

          curl -fsS "http://127.0.0.1:${PORT}/openapi.json" >/dev/null
          echo "openapi.json: ok"

          MCP="$(curl -fsS -X POST "http://127.0.0.1:${PORT}/mcp" \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')"
          printf '%s' "$MCP" | grep -q '"tools"'
          echo "mcp tools/list: ok"

  # Retag an existing image (no rebuild): `backfill_version=v0.24.13` +
  # `backfill_source=api` publishes :v0.24.13 and :latest from the current
  # :api image. Runs standalone — no needs, it does not rebuild anything.
  backfill:
    name: Backfill (retag existing image)
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.backfill_version != ''
      && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag source image as version + latest
        env:
          VERSION: ${{ inputs.backfill_version }}
          SOURCE: ${{ inputs.backfill_source }}
        run: |
          set -euo pipefail
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::backfill_version '$VERSION' must match ^v[0-9]+\.[0-9]+\.[0-9]+$"
            exit 1
          fi
          if [ -z "${SOURCE:-}" ]; then
            echo "::error::backfill_source must not be empty"
            exit 1
          fi
          echo "retagging $REPO:$SOURCE -> $REPO:$VERSION + $REPO:latest"
          docker buildx imagetools create \
            -t "$REPO:$VERSION" \
            -t "$REPO:latest" \
            "$REPO:$SOURCE"