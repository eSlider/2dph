# 2dph Edelweiss pilot — knowledge brain.
#
#   docker compose -f compose.edelweiss.yml build
#   docker compose -f compose.edelweiss.yml run --rm brain index --rebuild \
#     --corpus /corpus/docs --corpus /corpus/ui-docs --corpus /corpus/reports
#   docker compose -f compose.edelweiss.yml run --rm brain search "query"
#
# Host corpus dirs set via env: DOCS_BASE (default: /home/devops/projects)
name: 2dph-edelweiss

services:
  brain:
    build:
      context: .
      dockerfile: Dockerfile
    image: 2dph-edelweiss:local
    working_dir: /app
    environment:
      HF_HOME: /data/hf
      BRAIN_SEARCH_CACHE: /data/cache/web-search.sqlite
      KB_SEARCH_CMD: /app/bin/kb/search
      KB_WORKERS: "2"
      KB_PY: python3
      KB_ROOT: /app
      DOCS_BASE: ${DOCS_BASE:-/home/devops/projects}
    volumes:
      - kb-model:/data/hf
      - kb-var:/data
      - ./:/app
      - ${DOCS_BASE:-/home/devops/projects}/docs/docs:/corpus/docs:ro
      - ${DOCS_BASE:-/home/devops/projects}/edelweiss-ui/docs:/corpus/ui-docs:ro
      - ${DOCS_BASE:-/home/devops/projects}/docs/docs/reports:/corpus/reports:ro
      - ${DOCS_BASE:-/home/devops/projects}/docs/stt:/corpus/stt:ro
    command: ["brain", "search", "help"]
    read_only: false
    tmpfs:
      - /tmp
    restart: "no"

volumes:
  kb-model:
  kb-var:
