# 2dph — docker composition
#
#   scripts/stack/start / start-assistant / status / stop
#   docker compose up -d brain                  # API (Zig CGO serve)
#   docker compose --profile index run --rm index   # Go rebuild (zig cgo)
#   docker compose --profile picoclaw up -d     # brain-mcp + CPU reasoner + PicoClaw gateway
#   docker compose --profile reasoner up -d reasoner   # CPU Ollama :11435
#   docker compose --profile searxng up -d
#   OCR_ENGINE=paddle docker compose --profile ocr-paddle run --rm ocr-paddle
#
# Secrets never baked in: search.env + db-profiles.yml from ~/.config/brain.

name: 2dph

networks:
  default:
    name: 2dph_sys
    driver: bridge
    ipam:
      config:
        - subnet: 10.23.42.0/24

services:
  brain:
    image: ghcr.io/eslider/2dph:api
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      cache_from:
        - ghcr.io/eslider/2dph:cache
    command: ["serve"]
    environment: &env
      HOME: /data
      HF_HOME: /data/var/hf
      KB_HOST: 0.0.0.0
      BRAIN_SEARCH_CACHE: /data/var/cache/web-search.sqlite
      BRAIN_DB_PROFILES: /secret/db-profiles.yml
      BRAIN_SEARCH_ENV: /secret/search.env
      KB_ROOT: /data
      KB_WORKERS: "4"
      KB_PORT: "8630"
      # Ladybug write path needs a pool larger than the ~1.4GB DB (docs/brain/rebuild.md).
      # Rebuild uses 10GB; the serve-side incremental pool stays at the 4GB default
      # to avoid HNSW write stalls with a large pool.
      KB_BUFFER_POOL: "4294967296"
      # In-process embedding: the daemon on KBSEARCH_PORT is only started by
      # the entrypoint when the image carries a working brain-search; embedding
      # in-process avoids a respawn loop against a dead daemon.
      KBSEARCH_NO_DAEMON: "1"
      KB_PPROF: "1707"
    network_mode: host
    volumes:
      - ./var:/data/var
      - ~/.config/brain:/secret:ro
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8630/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 20s

  brain-watch:
    image: ghcr.io/eslider/2dph:api
    environment: *env
    volumes:
      - ./var:/data/var
      - ..:/corpus:ro
      - ~/.config/brain:/secret:ro
    command: ["watch", "/corpus"]
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    stop_grace_period: 20s

  # Go write path (Ladybug rebuild, brain-index Zig binary). Same api image.
  #   docker compose --profile index run --rm index
  index:
    profiles: ["index"]
    image: ghcr.io/eslider/2dph:api
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      <<: *env
      # sanctioned swap+restart flow: the live-holder guard must not block it
      KB_INDEX_ALLOW_LIVE: "1"
    volumes:
      - ./var:/data/var
      - ..:/corpus:ro
      - ~/.config/brain:/secret:ro
    command: ["index"]
    read_only: true
    tmpfs:
      - /tmp

  # mail-sync ETL: download (existing mailsync binary) → bounded runner
  # pipeline import (#98) every 300s into shared var, with a per-run stats YAML.
  # Full brain rebuild only when MAIL_SYNC_INDEX=1 (expensive on large mail
  # corpora). Default sources: onlyoffice,gmail. For M365 set MAIL_SYNC_SRC=m365
  # and put M365_TENANT/CLIENT_ID/CLIENT_SECRET/USERS in ~/.config/brain/mail.env
  # (or m365.env + MAIL_SYNC_ENV). Gmail OAuth: mount ~/.gmail-mcp.
  #   docker compose up -d mail-sync
  #   scripts/stack/start-mail-sync
  mail-sync:
    image: ghcr.io/eslider/2dph:api
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      HOME: /home/2dph
      HF_HOME: /data/var/hf
      MAIL_SYNC_SRC: onlyoffice,gmail
      MAIL_SYNC_ENV: /secret/mail.env
      MAIL_SYNC_INDEX: "0"
    volumes:
      - ./var:/data/var
      - ~/.config/brain:/secret:ro
      - ~/.gmail-mcp:/home/2dph/.gmail-mcp:ro
    command: ["runner", "300"]
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    stop_grace_period: 20s

  # Optional local SearXNG (D3). Skip if BRAIN_SEARCH_URL already points at a
  # live instance — do not run a second copy on that host.
  #   SEARXNG_SECRET=$(openssl rand -hex 32) docker compose --profile searxng up -d
  searxng:
    profiles: ["searxng"]
    image: docker.io/searxng/searxng:2026.8.10-0a118066d
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    volumes:
      - ./etc/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./etc/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    restart: unless-stopped

  # MCP endpoint for PicoClaw (and any MCP client).
  #   docker compose --profile picoclaw up -d
  brain-mcp:
    profiles: ["picoclaw"]
    image: ghcr.io/eslider/2dph:api
    environment: *env
    volumes:
      - ./var:/data/var
      - ~/.config/brain:/secret:ro
    command: ["serve"]
    ports:
      - "127.0.0.1:8630:8630"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  # CPU OpenAI-compatible sidecar (D18). Weights are pulled at runtime, not
  # baked into the 2dph image. Does not touch host Ollama on :11434.
  #   docker compose --profile reasoner up -d reasoner
  #   docker compose --profile reasoner exec reasoner ollama pull qwen3.5:9b
  reasoner:
    profiles: ["reasoner", "picoclaw"]
    image: docker.io/ollama/ollama:latest
    environment:
      OLLAMA_NUM_GPU: "0"
      OLLAMA_HOST: "0.0.0.0:11434"
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - reasoner-ollama:/root/.ollama
    restart: unless-stopped

  # Official PicoClaw gateway. Config has no secrets (Ollama + HTTP MCP).
  # Host network: brain/reasoner bind 127.0.0.1 only, so host.docker.internal
  # (docker0) cannot reach them. Gateway 127.0.0.1:18790 (not the 18800 launcher).
  # If :8630/:11435 are already bound, do not start brain-mcp/reasoner:
  #   docker compose --profile picoclaw up -d --no-deps picoclaw
  picoclaw:
    profiles: ["picoclaw"]
    image: docker.io/sipeed/picoclaw:v0.3.1
    network_mode: host
    depends_on:
      - brain-mcp
      - reasoner
    environment:
      PICOCLAW_GATEWAY_HOST: "127.0.0.1"
    entrypoint: ["picoclaw", "gateway"]
    volumes:
      - picoclaw-home:/root/.picoclaw
      - ./etc/picoclaw/config.json:/root/.picoclaw/config.json:ro
    restart: unless-stopped

  # Optional PP-OCRv5 (not default). Default OCR is tesseract eng+deu.
  #   OCR_ENGINE=paddle docker compose --profile ocr-paddle run --rm ocr-paddle
  ocr-paddle:
    profiles: ["ocr-paddle"]
    image: python:3.12-slim
    environment:
      OCR_ENGINE: paddle
    command: ["python", "-c", "print('OCR_ENGINE=paddle; install paddleocr on PATH')"]

volumes:
  reasoner-ollama:
  picoclaw-home:
